name: Build Static qBittorrent Windows

on:
  workflow_dispatch:
    inputs:
      qbittorrent_version:
        description: 'qBittorrent Git Ref (branch, tag, or SHA)'
        required: true
        default: 'release-4.6.3'
      libtorrent_version:
        description: 'Libtorrent Git Ref (branch, tag, or SHA)'
        required: true
        default: 'v2.0.9'

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: Checkout qBittorrent
        uses: actions/checkout@v4
        with:
          repository: qbittorrent/qBittorrent
          ref: ${{ github.event.inputs.qbittorrent_version }}
          path: qbittorrent
          submodules: recursive

      - name: Checkout libtorrent
        uses: actions/checkout@v4
        with:
          repository: arvidn/libtorrent
          ref: ${{ github.event.inputs.libtorrent_version }}
          path: libtorrent
          submodules: recursive

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Dependencies (vcpkg)
        run: |
          # Install core dependencies via vcpkg
          # We force static triplets for Windows
          vcpkg install boost-system:x64-windows-static
          vcpkg install boost-asio:x64-windows-static
          vcpkg install openssl:x64-windows-static
          vcpkg install qtbase:x64-windows-static
          vcpkg install qtsvg:x64-windows-static
          vcpkg install qttools:x64-windows-static
          vcpkg install zlib:x64-windows-static

      - name: Build libtorrent (Static)
        run: |
          cd libtorrent
          cmake -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -Dsingle_conf=ON `
            -Dstatic_runtime=ON `
            -Dshared_lib=OFF `
            -DCMAKE_TOOLCHAIN_FILE=C:/thirdparty/vcpkg/scripts/buildsystems/vcpkg.cmake `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static
          cmake --build build --config Release --parallel $env:NUMBER_OF_PROCESSORS
          cmake --install build --prefix ../dist

      - name: Build qBittorrent (Static)
        run: |
          cd qbittorrent
          cmake -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DMSVC_RUNTIME_DYNAMIC=OFF `
            -DGUI=ON `
            -DWEBUI=ON `
            -DSTACKTRACE=OFF `
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/dist" `
            -DCMAKE_TOOLCHAIN_FILE=C:/thirdparty/vcpkg/scripts/buildsystems/vcpkg.cmake `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static
          cmake --build build --config Release --parallel $env:NUMBER_OF_PROCESSORS

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: qBittorrent-Static-${{ github.event.inputs.qbittorrent_version }}
          path: qbittorrent/build/release/qbittorrent.exe

name: Build qBittorrent v5_0_x Windows Static

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Setup MSVC environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Install dependencies
      run: |
        Invoke-WebRequest -Uri "https://archives.boost.io/release/1.86.0/source/boost_1_86_0.zip" -OutFile "boost_1_86_0.zip"
        Expand-Archive -Path "boost_1_86_0.zip" -DestinationPath C:\ -Force
        cd C:\vcpkg
        git pull
        bootstrap-vcpkg.bat
        vcpkg install --vcpkg-root=C:\vcpkg zlib:x64-windows-static openssl:x64-windows-static qtbase:x64-windows-static qtsvg:x64-windows-static qttools:x64-windows-static --clean-after-build
    - name: Build libtorrent
      run: |
        git clone --recurse-submodules --branch RC_1_2 --depth 1 https://github.com/arvidn/libtorrent.git
        cd libtorrent
        cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=C:\vcpkg\scripts\buildsystems\vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows-static -DBUILD_SHARED_LIBS=OFF -Dstatic_runtime=ON -Ddeprecated-functions=OFF -DBoost_INCLUDE_DIR=C:\boost_1_86_0 -Wno-dev
        cmake --build build
        cmake --install build --prefix C:\libtorrent-install

    - name: Build qBittorrent
      run: |
        git clone --branch v5_0_x --depth 1 https://github.com/qbittorrent/qBittorrent.git
        cd qBittorrent
        cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=C:\vcpkg\scripts\buildsystems\vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows-static -DMSVC_RUNTIME_DYNAMIC=OFF -DLibtorrentRasterbar_DIR=C:\libtorrent-install\lib\cmake\LibtorrentRasterbar\ -DBoost_INCLUDE_DIR=C:\boost_1_86_0 -Wno-dev
        cmake --build build
        cmake --install build --prefix C:\qbt --strip

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: qbt
        path: C:\qbt
